<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self'; 
                 script-src 'self' 'unsafe-inline'; 
                 style-src 'self' 'unsafe-inline';">
  <title>質問入力</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
      background: transparent;
      padding: 0;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .question-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .title {
      display: none; /* タイトルを非表示にしてコンパクトに */
    }

    .subtitle {
      display: none; /* サブタイトルも非表示にしてコンパクトに */
    }

    #question-input {
      width: 100%;
      height: 35px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #333;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      line-height: 1.2;
    }

    #question-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }

    .loading {
      display: none;
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 10px;
    }

    .loading.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="question-container">
    <h3 class="title">💬 質問を入力してください</h3>
    <p class="subtitle">直前にキャプチャした画面について質問できます</p>
    
    <textarea id="question-input" 
              placeholder="例: 画面上のグラフの最大値は何ですか？"
              autofocus></textarea>
    
    <div class="hint">
      <strong>Enter</strong>: 送信 | <strong>Escape</strong>: キャンセル
    </div>
    
    <div id="loading" class="loading">質問を分析中...</div>
  </div>

  <script>
    const questionInput = document.getElementById('question-input');
    const loading = document.getElementById('loading');

    // 自動フォーカス（少し遅延）
    setTimeout(() => {
      questionInput.focus();
    }, 100);

    // キーボードイベント
    questionInput.addEventListener('keydown', (e) => {
      // 日本語入力の変換中（IME オン）の Enter は「変換の確定」であって送信ではない。
      // isComposing を見ないと、変換を確定した瞬間にそのまま送信されてしまう。
      // keyCode 229 は、一部環境で isComposing が立たない場合の保険。
      if (e.isComposing || e.keyCode === 229) return;

      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitQuestion();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelQuestion();
      }
    });

    // 質問送信
    function submitQuestion() {
      const questionText = questionInput.value.trim();
      
      if (!questionText) {
        questionInput.focus();
        return;
      }

      // ローディング表示
      questionInput.disabled = true;
      loading.classList.add('show');
      
      // メインプロセスに質問を送信
      window.electronAPI.submitQuestion(questionText);
    }

    // キャンセル
    function cancelQuestion() {
      window.electronAPI.cancelQuestion();
    }
  </script>
</body>
</html>
