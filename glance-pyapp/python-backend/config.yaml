# Glance Python Backend Configuration
# モデル設定とプロンプト

activeModel: internvl-3_5-4b-gguf

models:
  # ===== GGUF量子化モデル（推奨）=====
  internvl-3_5-4b-gguf:
    name: InternVL 3.5 4B GGUF (Q4_K_M)
    type: internvl_gguf
    path: models/gguf/OpenGVLab_InternVL3_5-4B-Q4_K_M.gguf
    mmproj_path: models/gguf/mmproj-OpenGVLab_InternVL3_5-4B-bf16.gguf
    precision: high
    estimatedInferenceTime: 5-15s (CPU with LlamaPromptLookupDecoding)
    ramRequired: 3GB (CPU)
    speculativeDecoding: LlamaPromptLookupDecoding

  # ===== Transformersモデル（旧）=====
  internvl-3_5_4b:
    name: InternVL 3.5 4B (Transformers)
    type: internvl
    path: models/InternVL3.5-4B
    precision: high
    estimatedInferenceTime: 15-30s (CPU), 3-8s (GPU)
    ramRequired: 8GB (CPU), 4GB (GPU)

  internvl-26b:
    name: InternVL 2.5 26B
    type: internvl
    path: models/InternVL2.5-26B
    precision: maximum
    estimatedInferenceTime: 60-180s (CPU), 15-40s (GPU)
    ramRequired: 32GB (CPU), 16GB (GPU)
    
  internvl-8b:
    name: InternVL 2.5 8B
    type: internvl
    path: models/InternVL2.5-8B
    precision: very_high
    estimatedInferenceTime: 30-60s (CPU), 5-15s (GPU)
    ramRequired: 16GB (CPU), 8GB (GPU)
    
  internvl-4b:
    name: InternVL 2.5 4B
    type: internvl
    path: models/InternVL2.5-4B
    precision: high
    estimatedInferenceTime: 15-30s (CPU), 3-8s (GPU)
    ramRequired: 8GB (CPU), 4GB (GPU)

  internvl-1b:
    name: InternVL 2.5 1B
    type: internvl
    path: models/InternVL2.5-1B
    precision: high
    estimatedInferenceTime: 15-30s (CPU), 3-8s (GPU)
    ramRequired: 8GB (CPU), 4GB (GPU)
    
  qwen2-vl-7b:
    name: Qwen2-VL 7B Instruct
    type: qwen
    path: ../models/Qwen2-VL-7B-Instruct
    precision: very_high
    estimatedInferenceTime: 30-60s (CPU), 5-15s (GPU)
    ramRequired: 16GB (CPU), 8GB (GPU)

# プロンプト設定
prompt:
  systemPrompt: |
    画面に表示されている内容を100文字程度で簡潔に要約してください。
    図や表がある場合は、そのタイトルや数値、傾向を読み取って説明に含めてください。
    全体が把握できない場合でも、認識できた要素（テキストやボタンなど）を列挙してください。
    ここでは詳細を述べる必要はありません。詳細のフェーズは別にあるので、あくまで概要を把握できる簡素な説明を提供してください。
  
  detailedPrompt: |
    画面に表示されている内容を、以下の順序で詳細に日本語で説明してください：
    
    1. 全体の概要: 何のアプリケーション・画面か（例: Teams会議、Excel、Webブラウザ）
    2. 主要な情報: 最も重要な要素（タイトル、見出し、メインコンテンツ）
    3. グラフ・図表: 種類、軸ラベル、データの傾向、具体的な数値を詳細に
    
    曖昧な表現は避け、可能な限り正確かつ詳細に説明してください。
    数値やテキストは正確に読み上げてください。
  
  # 将来の拡張のために準備
  questionPrompt: |
    以下の質問に基づいて、画面に表示されている内容について詳細に回答してください：
    全体が把握できない場合でも、認識できた要素（テキストやボタンなど）を列挙してください。

    質問: {question}
  
  temperature: 0.1
  maxTokens: 1000
  topP: 0.9
  repetition_penalty: 1.2  # 繰り返しにペナルティ（1.0-2.0、デフォルト1.0）
  no_repeat_ngram_size: 3  # 同じN-gramの繰り返しを防ぐ
  max_token: 5000  # モデルの最大トークン数

# サーバー設定
server:
  host: 127.0.0.1
  port: 5001
  debug: false
