# Glance Python Backend Configuration
# モデル設定とプロンプト

activeModel: internvl-3_5-1b-gguf
# activeModel: internvl-3_5-4b-gguf

models:
  # ===== GGUF量子化モデル（推奨）=====
  internvl-3_5-1b-gguf:
    name: InternVL 3.5 1B GGUF (Q4_K_M)
    type: internvl_gguf
    path: models/gguf/OpenGVLab_InternVL3_5-1B-Q4_K_M.gguf
    mmproj_path: models/gguf/mmproj-OpenGVLab_InternVL3_5-1B-f16.gguf
    precision: high
    estimatedInferenceTime: 5-15s (CPU with LlamaPromptLookupDecoding)
    ramRequired: 2GB (CPU)
    speculativeDecoding: LlamaPromptLookupDecoding

  # # ===== GGUF量子化モデル（推奨）=====
  # internvl-3_5-4b-gguf:
  #   name: InternVL 3.5 4B GGUF (Q4_K_M)
  #   type: internvl_gguf
  #   path: models/gguf/OpenGVLab_InternVL3_5-4B-Q4_K_M.gguf
  #   mmproj_path: models/gguf/mmproj-OpenGVLab_InternVL3_5-4B-f16.gguf
  #   precision: high
  #   estimatedInferenceTime: 5-15s (CPU with LlamaPromptLookupDecoding)
  #   ramRequired: 3GB (CPU)
  #   speculativeDecoding: LlamaPromptLookupDecoding

# プロンプト設定
prompt:
  systemPrompt: |
    画面に表示されている内容を100文字程度で簡潔に要約してください。
    図や表がある場合は、そのタイトルや数値、傾向を読み取って説明に含めてください。
    全体が把握できない場合でも、認識できた要素（テキストやボタンなど）を列挙してください。
    ここでは詳細を述べる必要はありません。詳細のフェーズは別にあるので、あくまで概要を把握できる簡素な説明を提供してください。
    回答は必ず **日本語で** 行ってください。
  
  detailedPrompt: |
    画面に表示されている内容を、以下の順序で詳細に日本語で説明してください：
    
    1. 全体の概要: 何のアプリケーション・画面か（例: Teams会議、Excel、Webブラウザ）
    2. 主要な情報: 最も重要な要素（タイトル、見出し、メインコンテンツ）
    3. グラフ・図表: 種類、軸ラベル、データの傾向、具体的な数値を詳細に
    
    曖昧な表現は避け、可能な限り正確かつ詳細に説明してください。
    数値やテキストは正確に読み上げてください。
    回答は必ず **日本語で** 行ってください。
  
  # 将来の拡張のために準備
  questionPrompt: |
    以下の質問に基づいて、画面に表示されている内容について詳細に回答してください：
    全体が把握できない場合でも、認識できた要素（テキストやボタンなど）を列挙してください。
    回答は必ず **日本語で** 行ってください。

    質問: {question}
  
  temperature: 0.2
  topP: 0.9
  repetition_penalty: 1.15  # 繰り返しにペナルティ（1.0-2.0、デフォルト1.0）
  no_repeat_ngram_size: 3  # 同じN-gramの繰り返しを防ぐ
  max_token: 5000  # モデルの最大トークン数
  
  # 機能別のmaxTokens設定
  maxTokens:
    summary: 200      # 概要説明
    detailed: 500     # 詳細説明
    question: 200     # 質問回答

# サーバー設定
server:
  host: 127.0.0.1
  port: 5001
  debug: false
