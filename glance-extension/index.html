<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 12px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #4a90d9;
      color: white;
    }
    button:hover, button:focus {
      background: #357abd;
      outline: 3px solid #ff6600;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      padding: 12px;
      font-size: 16px;
      background: #f5f5f5;
      border-radius: 8px;
      min-height: 80px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Glance</h1>
  
  <button id="capture-btn" aria-describedby="status">
    画面を読み取る
  </button>
  
  <button id="speak-btn" aria-label="結果を読み上げる" disabled>
    読み上げる
  </button>
  
  <button id="stop-btn" aria-label="読み上げを停止" disabled>
    停止
  </button>

  <div id="status" role="status" aria-live="polite" aria-atomic="true">
    準備完了。「画面を読み取る」ボタンを押してください。
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
