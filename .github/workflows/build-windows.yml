name: Build Windows Installer

on:
  push:
    tags:
      - 'v*' # "v1.0.0" などのタグを打つと実行されます
  workflow_dispatch: # 手動実行も可能に

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Python環境のセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Python dependencies
      working-directory: ./glance-pyapp/python-backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # 1.5 llama-server.exe をダウンロード
    - name: Download llama-server binary
      run: |
        # Windows 用 llama.cpp バイナリをダウンロード（最新リリース）
        Write-Host "========== llama-server.exe ダウンロード開始 =========="
        
        # GitHub API で最新リリース情報を取得
        Write-Host "📥 GitHub API から最新リリース情報を取得中..."
        try {
          $response = Invoke-WebRequest -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest" -Headers @{"Accept"="application/vnd.github.v3+json"}
          $latestRelease = $response.Content | ConvertFrom-Json
          Write-Host "✅ リリース情報取得完了: $($latestRelease.tag_name)"
        } catch {
          Write-Host "❌ ERROR: GitHub API 呼び出し失敗"
          Write-Host $_.Exception.Message
          exit 1
        }
        
        # Assets 一覧をログ出力して確認
        Write-Host "📋 利用可能な assets:"
        foreach ($asset in $latestRelease.assets) {
          Write-Host "  - $($asset.name)"
        }
        
        # Windows x64 バイナリを探す（複数のパターンに対応）
        Write-Host "🔍 Windows x64 バイナリを検索中..."
        $windowsAsset = $null
        
        # 優先: Vulkan ビルド。CPU は -ngl 0 で動作し、対応 iGPU/GPU では -ngl 99 で
        # GPU 動作する単一バイナリ。バックエンドの GPU/CPU 切替は起動時プローブ(backend_selector)が決定。
        foreach ($asset in $latestRelease.assets) {
          if ($asset.name -match "bin-win-vulkan-x64.*\.zip$") {
            $windowsAsset = $asset
            Write-Host "✅ Vulkan ビルド検出: $($asset.name)"
            break
          }
        }
        # フォールバック: Vulkan 資産が無い場合は CPU ビルド
        if (-not $windowsAsset) {
          foreach ($asset in $latestRelease.assets) {
            $name = $asset.name
            if ($name -match "bin-win.*x64.*\.zip$" -and $name -notmatch "cuda|opencl|hipblas|vulkan|arm64") {
              $windowsAsset = $asset
              Write-Host "⚠️ Vulkan 未検出。CPU ビルドにフォールバック: $name"
              break
            }
          }
        }
        
        if (-not $windowsAsset) {
          Write-Host "❌ ERROR: Windows x64 バイナリが見つかりません"
          Write-Host "利用可能な assets:"
          foreach ($asset in $latestRelease.assets) {
            Write-Host "  - $($asset.name)"
          }
          exit 1
        }
        
        # ダウンロード
        $downloadUrl = $windowsAsset.browser_download_url
        $assetName = $windowsAsset.name
        Write-Host "📥 ダウンロード開始..."
        Write-Host "  URL: $downloadUrl"
        Write-Host "  Asset: $assetName"
        
        try {
          Invoke-WebRequest -Uri $downloadUrl -OutFile "llama-cpp-bin.zip"
          Write-Host "✅ ダウンロード完了"
        } catch {
          Write-Host "❌ ERROR: ダウンロード失敗"
          Write-Host $_.Exception.Message
          exit 1
        }
        
        # ZIP を展開
        Write-Host "📂 ZIP を展開中..."
        try {
          Expand-Archive -Path "llama-cpp-bin.zip" -DestinationPath "llama-cpp-bin" -Force
          Write-Host "✅ 展開完了"
        } catch {
          Write-Host "❌ ERROR: ZIP 展開失敗"
          Write-Host $_.Exception.Message
          exit 1
        }
        
        # llama-server.exe を探す
        Write-Host "🔍 llama-server.exe を検索中..."
        $exePath = Get-ChildItem -Path "llama-cpp-bin" -Recurse -Filter "llama-server.exe" | Select-Object -First 1
        
        if ($exePath) {
          Write-Host "✅ llama-server.exe 検出"
          Write-Host "  検出パス: $($exePath.FullName)"
          
          # exe の親ディレクトリを特定
          $sourceDir = $exePath.Directory.FullName
          Write-Host "📋 ソースディレクトリ: $sourceDir"
          
          # ソースディレクトリ内の DLL とその他必要ファイルを確認
          Write-Host "📋 ソースディレクトリ内のファイル一覧:"
          $dllFiles = Get-ChildItem -Path $sourceDir -Filter "*.dll" | Select-Object Name
          $exeFiles = Get-ChildItem -Path $sourceDir -Filter "*.exe" | Select-Object Name
          $otherFiles = Get-ChildItem -Path $sourceDir -Filter "*.txt" | Select-Object Name
          
          Write-Host "  DLL ファイル:"
          if ($dllFiles.Count -gt 0) {
            foreach ($dll in $dllFiles) {
              Write-Host "    - $($dll.Name)"
            }
          } else {
            Write-Host "    (DLL なし)"
          }
          
          Write-Host "  EXE ファイル:"
          foreach ($exe in $exeFiles) {
            Write-Host "    - $($exe.Name)"
          }
          
          # ソースディレクトリを丸ごと python-backend にコピー
          $destDir = "./glance-pyapp/python-backend/llama-cpp-bin"
          Write-Host "📋 コピー先: $destDir"
          Write-Host "📋 ソースディレクトリの内容を丸ごとコピー中..."
          
          try {
            # 既存ディレクトリがあれば削除
            if (Test-Path $destDir) {
              Remove-Item -Path $destDir -Recurse -Force
            }
            
            # ソースディレクトリ自体をコピー（subdirectory 構造も保持）
            Copy-Item -Path $sourceDir -Destination $destDir -Recurse -Force
            Write-Host "✅ ソースディレクトリのコピー完了"
            
            # コピー後の確認
            Write-Host "📋 コピー後のファイル確認:"
            $copiedFiles = Get-ChildItem -Path $destDir -Recurse | Where-Object {$_.PSIsContainer -eq $false}
            Write-Host "  合計ファイル数: $($copiedFiles.Count)"
            
            $copiedDlls = Get-ChildItem -Path $destDir -Filter "*.dll" -Recurse
            Write-Host "  DLL ファイル数: $($copiedDlls.Count)"
            if ($copiedDlls.Count -eq 0) {
              Write-Host "  ⚠️ WARNING: DLL が見つかりません。実行時にエラーが発生する可能性があります"
            }
            
            $copiedExes = Get-ChildItem -Path $destDir -Filter "llama-server.exe" -Recurse
            if ($copiedExes.Count -eq 0) {
              Write-Host "  ❌ ERROR: llama-server.exe のコピーに失敗しました"
              exit 1
            }
            Write-Host "  ✅ llama-server.exe のコピー確認"
            
          } catch {
            Write-Host "❌ ERROR: ソースディレクトリのコピー失敗"
            Write-Host $_.Exception.Message
            exit 1
          }
        } else {
          Write-Host "❌ ERROR: llama-server.exe が展開後のアーカイブに見つかりません"
          Write-Host "展開後のディレクトリ構造:"
          Get-ChildItem -Path "llama-cpp-bin" -Recurse -Filter "*.exe" | Select-Object FullName | Head -20
          exit 1
        }
        
        Write-Host "========== llama-server.exe ダウンロード完了 =========="

    # 2. Pythonバックエンドのビルド（モデルを含まないので高速）
    - name: Build Python Backend
      working-directory: ./glance-pyapp/python-backend
      run: |
        pyinstaller glance.spec

    # 2.5 llama-cpp-bin (exe + DLL) を dist/glance-backend/ にコピー
    - name: Copy llama-cpp-bin to PyInstaller dist
      run: |
        Write-Host "========== llama-cpp-bin (exe + DLL) を dist へコピー =========="
        
        # コピー元ディレクトリを確認
        Write-Host "📋 ステップ1: コピー元の確認"
        $sourceDir = "./glance-pyapp/python-backend/llama-cpp-bin"
        Write-Host "  ソースディレクトリ: $sourceDir"
        
        if (-not (Test-Path $sourceDir)) {
          Write-Host "❌ ERROR: llama-cpp-bin ディレクトリが見つかりません"
          Write-Host "  python-backend フォルダ内の内容:"
          Get-ChildItem "./glance-pyapp/python-backend/" -Directory
          exit 1
        }
        
        Write-Host "✅ ソースディレクトリ確認: $sourceDir"
        
        # ソースディレクトリ内のファイル一覧を確認
        Write-Host "📋 ソースディレクトリ内のファイル一覧:"
        $sourceFiles = Get-ChildItem -Path $sourceDir -Recurse | Where-Object {$_.PSIsContainer -eq $false}
        $sourceDlls = Get-ChildItem -Path $sourceDir -Filter "*.dll" -Recurse
        $sourceExes = Get-ChildItem -Path $sourceDir -Filter "llama-server.exe" -Recurse
        
        Write-Host "  合計ファイル数: $($sourceFiles.Count)"
        Write-Host "  DLL ファイル数: $($sourceDlls.Count)"
        
        if ($sourceDlls.Count -eq 0) {
          Write-Host "  ⚠️ WARNING: DLL が見つかりません"
        }
        
        Write-Host "  DLL 一覧:"
        foreach ($dll in $sourceDlls) {
          Write-Host "    - $($dll.Name)"
        }
        
        if ($sourceExes.Count -eq 0) {
          Write-Host "  ❌ ERROR: llama-server.exe が見つかりません"
          exit 1
        }
        
        # コピー先ディレクトリを確認
        Write-Host "📋 ステップ2: コピー先ディレクトリの確認"
        $destDir = "./glance-pyapp/python-backend/dist/glance-backend"
        Write-Host "  対象ディレクトリ: $destDir"
        
        if (-not (Test-Path $destDir)) {
          Write-Host "❌ ERROR: PyInstaller dist ディレクトリが見つかりません"
          exit 1
        }
        
        Write-Host "✅ dist ディレクトリ確認完了"
        
        # llama-cpp-bin をコピー
        Write-Host "📋 ステップ3: llama-cpp-bin を dist へコピー"
        $destLlamaBinDir = "$destDir\llama-cpp-bin"
        Write-Host "  コピー元: $sourceDir"
        Write-Host "  コピー先: $destLlamaBinDir"
        
        try {
          # 既存ディレクトリがあれば削除
          if (Test-Path $destLlamaBinDir) {
            Remove-Item -Path $destLlamaBinDir -Recurse -Force
            Write-Host "  既存ディレクトリを削除しました"
          }
          
          # コピー
          Copy-Item -Path $sourceDir -Destination $destLlamaBinDir -Recurse -Force
          Write-Host "✅ コピー完了"
        } catch {
          Write-Host "❌ ERROR: llama-cpp-bin のコピーに失敗"
          Write-Host $_.Exception.Message
          exit 1
        }
        
        # コピー後の確認
        Write-Host "📋 ステップ4: コピー後の確認"
        $destFiles = Get-ChildItem -Path $destLlamaBinDir -Recurse | Where-Object {$_.PSIsContainer -eq $false}
        $destDlls = Get-ChildItem -Path $destLlamaBinDir -Filter "*.dll" -Recurse
        $destExes = Get-ChildItem -Path $destLlamaBinDir -Filter "llama-server.exe" -Recurse
        
        Write-Host "  合計ファイル数: $($destFiles.Count)"
        Write-Host "  DLL ファイル数: $($destDlls.Count)"
        
        if ($destDlls.Count -eq 0) {
          Write-Host "  ⚠️ WARNING: DLL がコピーされていません。実行時エラーが発生する可能性があります"
        } else {
          Write-Host "  ✅ DLL がコピーされています"
          Write-Host "  DLL 一覧:"
          foreach ($dll in $destDlls) {
            Write-Host "    - $($dll.Name)"
          }
        }
        
        if ($destExes.Count -eq 0) {
          Write-Host "  ❌ ERROR: llama-server.exe がコピーされていません"
          exit 1
        }
        Write-Host "  ✅ llama-server.exe がコピーされています"
        
        Write-Host "========== llama-cpp-bin を dist へコピー完了 =========="

    # 3. Node.js環境のセットアップ
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './glance-pyapp/electron/package-lock.json'

    - name: Install Electron dependencies
      working-directory: ./glance-pyapp/electron
      run: npm ci

    # 4. ビルド済みPythonバックエンドをElectronのリソースにコピー
    - name: Copy Python backend to Electron resources
      run: |
        Write-Host "========== Electron resources への配置 =========="
        
        New-Item -ItemType Directory -Force -Path ./glance-pyapp/electron/resources
        Write-Host "✅ resources ディレクトリ作成完了"
        
        Write-Host "📋 dist/glance-backend/ を resources へコピー中..."
        Copy-Item -Recurse -Force ./glance-pyapp/python-backend/dist/glance-backend ./glance-pyapp/electron/resources/
        Write-Host "✅ コピー完了"

    # 4.5 llama-server.exe + DLL の最終配置確認
    - name: Verify llama-server.exe and DLLs in final location
      run: |
        Write-Host "========== llama-server.exe と DLL の最終配置確認 =========="
        
        # 確認1: glance-pyapp/python-backend/llama-cpp-bin/
        Write-Host "📋 確認1: python-backend/llama-cpp-bin/"
        $check1Path = "./glance-pyapp/python-backend/llama-cpp-bin"
        Write-Host "  パス: $check1Path"
        if (Test-Path $check1Path) {
          $files = Get-ChildItem -Path $check1Path -Recurse | Where-Object {$_.PSIsContainer -eq $false}
          $dlls = Get-ChildItem -Path $check1Path -Filter "*.dll" -Recurse
          $exes = Get-ChildItem -Path $check1Path -Filter "llama-server.exe" -Recurse
          
          Write-Host "  ✅ ディレクトリ存在確認: OK"
          Write-Host "  ファイル数: $($files.Count)"
          Write-Host "  DLL 数: $($dlls.Count)"
          
          if ($dlls.Count -eq 0) {
            Write-Host "  ⚠️ WARNING: DLL が見つかりません"
          } else {
            Write-Host "  ✅ DLL が含まれています"
          }
          
          if ($exes.Count -gt 0) {
            Write-Host "  ✅ llama-server.exe が含まれています"
          } else {
            Write-Host "  ❌ ERROR: llama-server.exe が見つかりません"
            exit 1
          }
        } else {
          Write-Host "  ❌ ERROR: ディレクトリが見つかりません"
          exit 1
        }
        
        # 確認2: dist/glance-backend/llama-cpp-bin/
        Write-Host "📋 確認2: dist/glance-backend/llama-cpp-bin/"
        $check2Path = "./glance-pyapp/python-backend/dist/glance-backend/llama-cpp-bin"
        Write-Host "  パス: $check2Path"
        if (Test-Path $check2Path) {
          $files = Get-ChildItem -Path $check2Path -Recurse | Where-Object {$_.PSIsContainer -eq $false}
          $dlls = Get-ChildItem -Path $check2Path -Filter "*.dll" -Recurse
          $exes = Get-ChildItem -Path $check2Path -Filter "llama-server.exe" -Recurse
          
          Write-Host "  ✅ ディレクトリ存在確認: OK"
          Write-Host "  ファイル数: $($files.Count)"
          Write-Host "  DLL 数: $($dlls.Count)"
          
          if ($dlls.Count -eq 0) {
            Write-Host "  ❌ ERROR: DLL が見つかりません（実行時エラーの原因になります）"
            exit 1
          }
          
          Write-Host "  DLL 一覧:"
          foreach ($dll in $dlls) {
            Write-Host "    - $($dll.Name)"
          }
          
          if ($exes.Count -gt 0) {
            Write-Host "  ✅ llama-server.exe が含まれています"
          } else {
            Write-Host "  ❌ ERROR: llama-server.exe が見つかりません"
            exit 1
          }
        } else {
          Write-Host "  ❌ ERROR: ディレクトリが見つかりません"
          exit 1
        }
        
        # 確認3: electron/resources/glance-backend/llama-cpp-bin/
        Write-Host "📋 確認3: electron/resources/glance-backend/llama-cpp-bin/"
        $check3Path = "./glance-pyapp/electron/resources/glance-backend/llama-cpp-bin"
        Write-Host "  パス: $check3Path"
        if (Test-Path $check3Path) {
          $files = Get-ChildItem -Path $check3Path -Recurse | Where-Object {$_.PSIsContainer -eq $false}
          $dlls = Get-ChildItem -Path $check3Path -Filter "*.dll" -Recurse
          $exes = Get-ChildItem -Path $check3Path -Filter "llama-server.exe" -Recurse
          
          Write-Host "  ✅ ディレクトリ存在確認: OK"
          Write-Host "  ファイル数: $($files.Count)"
          Write-Host "  DLL 数: $($dlls.Count)"
          
          if ($dlls.Count -eq 0) {
            Write-Host "  ❌ ERROR: DLL が見つかりません（リリースには同梱されません）"
            exit 1
          }
          
          Write-Host "  DLL 一覧:"
          foreach ($dll in $dlls) {
            Write-Host "    - $($dll.Name)"
          }
          
          if ($exes.Count -gt 0) {
            Write-Host "  ✅ llama-server.exe が含まれています"
          } else {
            Write-Host "  ❌ ERROR: llama-server.exe が見つかりません"
            exit 1
          }
        } else {
          Write-Host "  ❌ ERROR: ディレクトリが見つかりません"
          exit 1
        }
        
        # 確認4: glance-backend.exe との共存確認
        Write-Host "📋 確認4: glance-backend.exe との共存確認"
        $glanceExePath = "./glance-pyapp/electron/resources/glance-backend/glance-backend.exe"
        Write-Host "  パス: $glanceExePath"
        if (Test-Path $glanceExePath) {
          $info = Get-Item $glanceExePath
          Write-Host "  ✅ glance-backend.exe 存在確認: OK"
          Write-Host "  サイズ: $($info.Length) bytes"
          Write-Host "  ✅ glance-backend.exe と llama-cpp-bin が同じディレクトリに存在"
        } else {
          Write-Host "  ❌ ERROR: glance-backend.exe が見つかりません"
          exit 1
        }
        
        Write-Host "========== 最終配置確認が完了（DLL も含まれています）=========="

    # 5. アプリのビルドとパッケージング
    - name: Build Electron App
      working-directory: ./glance-pyapp/electron
      run: npm run build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # 5.5 ビルド結果の確認
    #     タグを打つ前に workflow_dispatch で走らせて、インストーラのサイズと
    #     latest.yml の有無を確かめられるようにする。latest.yml が欠けると
    #     自動更新は無言で止まるので、公開前に必ずここで見る。
    - name: Show build output
      working-directory: ./glance-pyapp/electron
      run: |
        Write-Host "========== dist の中身 =========="
        Get-ChildItem dist -File | ForEach-Object {
          "{0,-45} {1,10:N1} MB" -f $_.Name, ($_.Length / 1MB)
        }
        if (Test-Path dist/latest.yml) {
          Write-Host ""
          Write-Host "---------- latest.yml ----------"
          Get-Content dist/latest.yml
        } else {
          Write-Host ""
          Write-Host "[WARNING] latest.yml がありません。自動更新が動きません"
        }

    # 5.6 タグ無しの実行では、インストーラを Actions の成果物として残す。
    #     公開リリースを作らずに実機へ入れて試せるようにするため。
    - name: Upload installer artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: glance-installer
        path: |
          glance-pyapp/electron/dist/*.exe
          glance-pyapp/electron/dist/latest.yml
        retention-days: 14

    # 6. 生成されたインストーラーをリリースにアップロード
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          glance-pyapp/electron/dist/*.exe
          glance-pyapp/electron/dist/*.zip
          glance-pyapp/electron/dist/latest.yml
        draft: false
        prerelease: false
        generate_release_notes: true
