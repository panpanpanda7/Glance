    precision: high
    estimatedInferenceTime: 5-15s (CPU with LlamaPromptLookupDecoding)
    ramRequired: 3GB (CPU)
    speculativeDecoding: LlamaPromptLookupDecoding

# プロンプト設定
prompt:
  # 【第1段階】画像から構造化JSON抽出
  phase1_extraction: |
    あなたは画面内容の構造化抽出を行うアシスタントです。
    以下の画像の内容を、JSON形式で整理してください。
    
    【重要な制約】
    - 出力はJSON形式のみ。説明文は不要。
    - 日本語のみで記述（英語のUI要素名はそのまま記載可）。
    - 推測禁止。見えている内容のみ。
    - 読み取れない部分は unclear_parts に記載。
    - コードフェンス（```）は使わず、JSONだけを出力。
    
    以下のJSON形式で出力してください:
    {
      "screen_type": "画面種別（例：ブラウザ、表計算、チャット、IDE、設定画面）",
      "main_goal": "この画面の主目的（例：記事閲覧、チャット確認、表編集）",
      "important_elements": ["重要なUI要素や領域の配列"],
      "important_text": ["意味理解に必要な文字列の配列"],
      "status_or_warning": "状態や警告があれば記述（なければnull）",
      "unclear_parts": "読み取りにくい部分（なければnull）",
      "confidence": 0.0から1.0の信頼度
    }

  # 【第2段階】構造化JSONから自然な要約説明を生成
  phase2_summary: |
    以下の画面構造データをもとに、視覚障害者向けの画面説明を生成してください。
    
    【重要な制約】
    - 3〜5文程度で簡潔に
    - 日本語のみ
    - 推測禁止。与えられたデータに基づいてのみ説明
    - 不明部分は「〜が読み取りにくい」と明示
    - OCR的な全文読み上げではなく、概要を述べること
    
    画面構造データ:
    {intermediate_json}

  # 【第2段階】構造化JSONから自然な詳細説明を生成
  phase2_detailed: |
    以下の画面構造データをもとに、視覚障害者向けの詳細な画面説明を生成してください。
    以下の順序で説明してください:
    
    1. 【アプリケーション・画面の種別】
    2. 【主要な情報・タイトル】
    3. 【主要UI要素】
    4. 【グラフ・図表・データ表示】
    5. 【重要なテキスト内容】
    
    【重要な制約】
    - 5〜10文程度で詳しく説明
    - 日本語のみ
    - 推測禁止。与えられたデータに基づいてのみ説明
    - 不明部分は「〜が読み取りにくい」と明示
    - 不要な詳細（色の説明、ボタン一つ一つなど）は省略
    
    画面構造データ:
    {intermediate_json}

  # 【レガシー】従来のシステムプロンプト（後方互換性）
  systemPrompt: |
    画面に表示されている内容を、3〜5文程度で簡潔に説明してください。
    
    【重要な制約】
    - 推測や想像は絶対にしない。見えている内容だけを説明してください。
    - 出力は必ず日本語のみで、他言語は一切含めないでください。
    - 不明な部分がある場合は「〜が見えています」と見えるもののみ記述し、推測で補わないでください。
    
    このプロンプトは画面全体の要約用です。詳細な説明は別のプロンプトで行われます。
    
  detailedPrompt: |
    画面に表示されている内容を、視覚障害者にとって有用になるよう詳細に説明してください。以下の順序で説明してください：
    
    1. 【アプリケーション・画面の種別】: 何のアプリか、どのような画面か（例：Google Sheets、Slack チャネル、GitHub Pull Request）
    2. 【主要な情報・タイトル】: 見出し、ページタイトル、重要な文言
    3. 【主要UI要素】: ボタン、メニュー、フォーム、タブなどの配置と役割（詳細な全列挙不要）
    4. 【グラフ・図表・データ表示】: あれば、種類、軸ラベル、傾向、主な数値を説明
    5. 【重要なテキスト内容】: ブロックテキスト、リスト、注釈など、意味を理解する上で必要な内容
    
    【重要な制約】
    - 推測や想像は絶対にしない。画像に見えているもののみを説明してください。
    - 出力は必ず日本語のみで、他言語は一切含めないでください。
    - 読み取りにくい部分は「読み取りが困難です」と記載し、推測で補わないでください。
    - 全ての文言の完全な書き起こしは不要。視覚障害者が状況を理解する上で重要な情報を厳選してください。
    - 不要な詳細（ボタン一つ一つ、すべての色の説明など）は省略しても構いません。
  
  questionPrompt: |
    以下の質問に基づいて、画面に表示されている内容について詳細に回答してください。
    
    【重要な制約】
    - 推測や想像は絶対にしない。画像に見えているもののみを説明してください。
    - 出力は必ず日本語のみで、他言語は一切含めないでください。
    - 全体が把握できない場合でも、認識できた要素のみを記述してください。
    
    質問: {question}
  
  # 生成パラメータ（保守的な設定）
  temperature: 0.0       # 決定論的な出力で繰り返しを最小化
  topP: 0.85             # 確率分布を適度に絞る
  repetition_penalty: 1.3  # 繰り返しに強いペナルティ（1.0-2.0のレンジ）
  no_repeat_ngram_size: 3  # 同じN-gramの繰り返しを防ぐ
  max_token: 5000        # モデルの最大トークン数
  
  # 機能別のmaxTokens設定
  maxTokens:
    summary: 150       # 要約は短め（3〜5文に整える）
    detailed: 400      # 詳細は現実的な長さ（段落レベル）
    question: 200      # 質問回答

# サーバー設定
server:
  host: 127.0.0.1
  port: 5001
  debug: false
