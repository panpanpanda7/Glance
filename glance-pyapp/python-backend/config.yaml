  # ===== Qwen2.5-VL GGUF量子化モデル（推奨）=====
  qwen2_5-vl-3b-gguf:
    name: Qwen2.5 VL 3B GGUF (Q4_K_M + Q8_0 mmproj)
    type: qwen_vl_gguf
    path: models/gguf/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
    mmproj_path: models/gguf/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf
    download_url: https://huggingface.co/Taoufik/Qwen2.5-VL-3B-Instruct-Q4_K_M-GGUF/resolve/main/qwen2.5-vl-3b-instruct-q4_k_m.gguf?download=true
    mmproj_download_url: https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/main/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf?download=true
    precision: high
    estimatedInferenceTime: 10-20s (CPU)
    ramRequired: 6GB (システムメモリ含む)

  qwen2_5-vl-7b-gguf:
    name: Qwen2.5 VL 7B GGUF (Q4_K_M + Q8_0 mmproj)
    type: qwen_vl_gguf
    path: models/gguf/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    mmproj_path: models/gguf/mmproj-Qwen2.5-VL-7B-Q8_0.gguf
    download_url: https://huggingface.co/bartowski/Qwen2.5-VL-7B-Instruct-GGUF/resolve/main/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
    mmproj_download_url: https://huggingface.co/bartowski/Qwen2.5-VL-7B-Instruct-GGUF/resolve/main/mmproj-Qwen2.5-VL-7B-Q8_0.gguf
    precision: high
    estimatedInferenceTime: 15-30s (CPU)
    ramRequired: 10GB (システムメモリ含む)

  # ===== Qwen3-VL 4B（llama-server経由・Windows配布対応）=====
  qwen3-vl-4b-server:
    name: Qwen3 VL 4B via llama-server
    type: qwen3_vl_server
    model_family: qwen3-vl
    backend: server
    path: models/gguf/Qwen3VL-4B-Instruct-Q4_K_M.gguf
    mmproj_path: models/gguf/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
    download_url: https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/Qwen3VL-4B-Instruct-Q4_K_M.gguf?download=true
    mmproj_download_url: https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/main/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf?download=true
    precision: high
    estimatedInferenceTime: 10-20s
    ramRequired: 8GB
    # llama-server設定（Windows配布向け）
    server_url: http://127.0.0.1:8080
    server_host: 127.0.0.1
    server_port: 8080
    auto_start_server: true
    bundled_server_binary: llama-cpp-bin/llama-server.exe
    ctx_size: 4096  # コンテキストサイズ（8GB RAM環境向け。4GB RAMの場合は4096を推奨）

  # ===== GGUF量子化モデル（後方互換）=====
  internvl-3_5-4b-gguf:
    # name: InternVL 3.5 4B GGUF (Q4_K_M)
    type: internvl_gguf
    path: models/gguf/OpenGVLab_InternVL3_5-4B-Q4_K_M.gguf
    mmproj_path: models/gguf/mmproj-OpenGVLab_InternVL3_5-4B-f16.gguf
    download_url: https://huggingface.co/bartowski/OpenGVLab_InternVL3_5-4B-GGUF/resolve/main/OpenGVLab_InternVL3_5-4B-Q4_K_M.gguf?download=true
    mmproj_download_url: https://huggingface.co/bartowski/OpenGVLab_InternVL3_5-4B-GGUF/resolve/e9319b553f22bd6e3bae10cff2e50985c1ab1d1a/mmproj-OpenGVLab_InternVL3_5-4B-f16.gguf?download=true
    precision: high
    estimatedInferenceTime: 5-15s (CPU with LlamaPromptLookupDecoding)
    ramRequired: 3GB (CPU)
    speculativeDecoding: LlamaPromptLookupDecoding

# プロンプト設定
prompt:
  # ============================================================
  # 【第1段階】画像から構造化JSON抽出
  #
  # 目的: 次の行動判断に必要な情報を漏れなく拾う
  # ============================================================
  phase1_extraction: |
    あなたは画面内容の構造化抽出を行うアシスタントです。
    以下の画像の内容を、JSON形式で整理してください。

    【重要な制約】
    - 出力はJSON形式のみ。説明文は不要。
    - 日本語のみで記述（英語のUI要素名はそのまま記載可）。
    - 推測禁止。見えている内容のみ。
    - 読み取れない部分は unclear_parts に記載。
    - コードフェンス（```）は使わず、JSONだけを出力。

    以下のJSON形式で出力してください:
    {
      "screen_category": "次のいずれか: app（操作型アプリ・ダイアログ・設定画面）/ document（資料・スライド・PDF・記事）/ data（グラフ・表・ダッシュボード）/ communication（チャット・メール・通知）/ web（情報閲覧ページ）/ other",
      "screen_type": "具体的な画面種別（例：Slack、Excelシート、PowerPointスライド、GitHub PRページ）",
      "main_goal": "この画面の主目的（例：設定変更、報告書確認、データ分析）",
      "key_message": "この画面が使用者に最も伝えようとしていること・最も注目すべき情報（1文で）",
      "important_text": ["意味理解に必要な文字列の配列"],
      "interactive_elements": [
        {
          "type": "ボタン・メニュー・タブ・リンクなどの種別",
          "label": "表示テキストまたはアイコン名",
          "position": "画面上の位置（例：左上、中央、右下、ツールバー左端）",
          "function": "この要素を操作するとどんな結果になるか"
        }
      ],
      "visual_emphasis": ["視覚的に強調されている情報。大きいフォントの数値、警告色の値、太字・ハイライト、グラフの急変点、アラートなど。なければ空配列"],
      "status_or_warning": "エラー・警告・処理中など状態があれば記述（なければnull）",
      "unclear_parts": "読み取りにくい部分（なければnull）",
      "confidence": 0.0から1.0の信頼度
    }

  # ============================================================
  # 【第2段階・要約】Cmd+G: 次の行動判断に必要な情報を簡潔に伝える
  #
  # 思想: 「何が画面にあるか」ではなく「何をすべきか・何に注目すべきか」を伝える
  # ============================================================
  phase2_summary: |
    以下の画面構造データをもとに、視覚障害者が「次に何をすべきか・何に注目すべきか」を
    判断できる説明を3〜5文で生成してください。

    screen_category に応じて焦点を変えること:

    - app（操作型アプリ）:
      今どんな状態か、そして主に何ができるかを伝える。
      重要なボタンや選択肢があれば簡潔に触れる。

    - document（資料・スライド・記事）:
      作成者が何を伝えようとしているか。
      主張・結論・要求を中心に伝える。

    - data（グラフ・表・ダッシュボード）:
      データが示す傾向・最大値・異常・判断に使える数値を伝える。

    - communication（チャット・メール・通知）:
      誰が何を伝えていて、返答や対応が必要かを伝える。

    - web（情報閲覧ページ）:
      ページの主要な内容と、次に取れる行動を伝える。

    【重要な制約】
    - 3〜5文で簡潔に
    - 日本語のみ
    - 見えている内容のみ。推測は禁止
    - 画面上の全要素を列挙しない。使用者の行動判断に直結する情報のみ伝える
    - visual_emphasis に項目がある場合は必ず含める

    画面構造データ:
    {intermediate_json}

  # ============================================================
  # 【第2段階・詳細】Cmd+D: 次の行動に必要な情報を詳しく伝える
  #
  # 思想: 「全要素の網羅」ではなく「使用者が判断・行動するための情報」を優先する
  # ============================================================
  phase2_detailed: |
    以下の画面構造データをもとに、視覚障害者が「この画面で何ができるか・何を理解すべきか」
    を把握できる詳細な説明を5〜10文で生成してください。

    screen_category に応じて以下の観点で説明すること:

    【app（操作型アプリ・ダイアログ・設定画面）】
    1. 何のアプリ・どの画面か
    2. 現在の状態・モード（選択中の項目、入力済み内容、有効/無効の設定など）
    3. 使用可能な操作: interactive_elements の各項目を
       「（位置）に（ラベル）があり、（機能）」の形式で説明する
    4. 注目すべき警告・強調・エラーがあれば伝える

    【document（資料・スライド・PDF・記事）】
    1. 文書の種類とタイトル
    2. 作成者が伝えようとしている主張・結論・要求（作者の意図を中心に）
    3. それを支える主な根拠・データ・ポイント
    4. 読者に求めている行動・次のステップがあれば伝える

    【data（グラフ・表・ダッシュボード）】
    1. データの種類・対象範囲・軸の内容
    2. 最も重要な数値・傾向・変化点
    3. 異常値・突出点・警告ラインがあれば説明
    4. このデータから客観的に読み取れること

    【communication（チャット・メール・通知）】
    1. 誰から誰への何の連絡か
    2. 伝えていることの要点
    3. 返答・対応・確認が求められているか
    4. 緊急性・重要度の兆候があれば伝える

    【web（情報閲覧ページ）】
    1. サイト名とページの主題
    2. 主要な情報・見出しの内容
    3. 次に取れる行動（主要リンク・ボタン）

    【重要な制約】
    - 5〜10文程度
    - 日本語のみ
    - 見えている内容のみ。推測は禁止
    - 全要素の網羅より「使用者が判断・行動するために必要な情報」を優先する
    - 不明部分は「〜が読み取りにくい」と明示

    画面構造データ:
    {intermediate_json}

  # ============================================================
  # 【レガシー】従来のシステムプロンプト（後方互換性）
  # ============================================================
  systemPrompt: |
    画面に表示されている内容を20文字程度で簡潔に要約してください。
    図や表がある場合は、そのタイトルや数値、傾向を読み取って説明に含めてください。
    全体が把握できない場合でも、認識できた要素（テキストやボタンなど）を列挙してください。
    ここでは詳細を述べる必要はありません。詳細のフェーズは別にあるので、あくまで概要を把握できる簡素な説明を提供してください。

  detailedPrompt: |
    画面に表示されている内容を、視覚障害者にとって有用になるよう詳細に説明してください。以下の順序で説明してください：

    1. 【アプリケーション・画面の種別】: 何のアプリか、どのような画面か（例：Google Sheets、Slack チャネル、GitHub Pull Request）
    2. 【主要な情報・タイトル】: 見出し、ページタイトル、重要な文言
    3. 【主要UI要素】: ボタン、メニュー、フォーム、タブなどの配置と役割（詳細な全列挙不要）
    4. 【グラフ・図表・データ表示】: あれば、種類、軸ラベル、傾向、主な数値を説明
    5. 【重要なテキスト内容】: ブロックテキスト、リスト、注釈など、意味を理解する上で必要な内容

    【重要な制約】
    - 推測や想像は絶対にしない。画像に見えているもののみを説明してください。
    - 出力は必ず日本語のみで、他言語は一切含めないでください。
    - 読み取りにくい部分は「読み取りが困難です」と記載し、推測で補わないでください。
    - 全ての文言の完全な書き起こしは不要。視覚障害者が状況を理解する上で重要な情報を厳選してください。
    - 不要な詳細（ボタン一つ一つ、すべての色の説明など）は省略しても構いません。

  questionPrompt: |
    以下の質問に基づいて、画面に表示されている内容について詳細に回答してください。

    【重要な制約】
    - 推測や想像は絶対にしない。画像に見えているもののみを説明してください。
    - 出力は必ず日本語のみで、他言語は一切含めないでください。
    - 全体が把握できない場合でも、認識できた要素のみを記述してください。

    質問: {question}

  # 生成パラメータ（保守的な設定）
  temperature: 0.0       # 決定論的な出力で繰り返しを最小化
  topP: 0.85             # 確率分布を適度に絞る
  repetition_penalty: 1.3  # 繰り返しに強いペナルティ（1.0-2.0のレンジ）
  no_repeat_ngram_size: 3  # 同じN-gramの繰り返しを防ぐ
  max_token: 200        # モデルの最大トークン数

  # 機能別のmaxTokens設定
  maxTokens:
    summary: 200       # 要約は短め（3〜5文に整える）
    detailed: 400      # 詳細は現実的な長さ（段落レベル）
    question: 200      # 質問回答

# サーバー設定
server:
  host: 127.0.0.1
  port: 5001
  debug: false
